name: bluefin-developers
description: My personal development Bluefin image.
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  # ------------------------------------------------------------------
  # Third-party repos.
  # Terra was removed: nothing in the package list below comes from it,
  # and it was the flaky step (primary.xml.zck curl timeout + unsigned
  # repo metadata) that broke the 2026-07-27 build.
  # ------------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        - alternateved/keyd
      files:
        - https://aaddrick.github.io/claude-desktop-debian/rpm/claude-desktop.repo

  # ------------------------------------------------------------------
  # Proton VPN: BETA channel.
  #
  # protonvpn-beta-release configures [protonvpn-fedora-unstable], the
  # channel carrying the "protun" backend (Stealth protocol). It now
  # ships inside python3-proton-vpn-api-core, which provides
  # /usr/lib/NetworkManager/VPN/nm-protun.name; the old proton-vpn-linux
  # package no longer exists.
  #
  # The beta-release RPM itself lives under the -stable/ tree.
  # Proton's signing key is imported first so this stays gpgcheck-clean.
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - curl -fsSL "https://repo.protonvpn.com/fedora-$(rpm -E %fedora)-stable/public_key.asc" -o /tmp/protonvpn.asc
      - rpm --import /tmp/protonvpn.asc
      - dnf install -y "https://repo.protonvpn.com/fedora-$(rpm -E %fedora)-stable/protonvpn-beta-release/protonvpn-beta-release-1.0.4-1.noarch.rpm"

  # ------------------------------------------------------------------
  # Packages
  # ------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        # --- Proton VPN dependencies ---
        # Installed here, with scriptlets running normally, so that the
        # noscripts transaction further down contains ONLY Proton
        # packages. Verified as the complete set of non-Proton deps that
        # bluefin-dx does not already carry.
        - python3-dbus-fast
        - python3-tabulate
        - python3-jinja2
        - python3-pynacl
        - python3-sentry-sdk

        # --- GNOME / GTK development headers ---
        - mutter-devel
        - gjs-devel
        - gtk4-devel
        - libadwaita-devel
        - gstreamer1-plugin-gtk4

        # --- Desktop / input / media ---
        # wtype, ydotool, wl-clipboard and vulkan-loader ship in bluefin-dx.
        - keyd
        - playerctl

        # --- System ---
        - waydroid

        # --- Apps ---
        - claude-desktop

  # ------------------------------------------------------------------
  # Proton VPN stack, installed with scriptlets disabled.
  #
  # proton-vpn-daemon's %posttrans runs:
  #     systemctl daemon-reload
  #     systemctl enable  me.proton.vpn.split_tunneling.service
  #     systemctl start   me.proton.vpn.split_tunneling.service
  #
  # `systemctl start` cannot work during an image build - there is no
  # system D-Bus - so it exits 1 and libdnf5 fails the whole
  # transaction ("Failed to connect to system scope bus ... Host is
  # down"). tsflags=noscripts skips it; the unit is instead enabled
  # declaratively in the systemd module below, and it starts at boot.
  #
  # Scoped to a separate transaction on purpose: every non-Proton
  # dependency is installed above, so nothing else loses its scriptlets.
  # The only other Proton scriptlets are `killall nm-protun-service
  # || true` guards, which are no-ops in a build.
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - dnf install -y --setopt=tsflags=noscripts proton-vpn-cli

  # ------------------------------------------------------------------
  # Memory stack: files/system is copied over / here.
  #
  #   zram-generator.conf.d/60-tiered.conf  lz4 primary, zstd recompression
  #   zram-recompress.{service,timer}       recompresses idle pages every
  #                                         30 min (zram has no in-kernel
  #                                         trigger; enabled below)
  #   tmpfiles.d/damon-reclaim.conf         DAMON_RECLAIM: proactive
  #                                         reclaim of cold pages into zram
  #   sysctl.d/99-proactive-reclaim.conf    earlier kswapd wakeup
  #
  # All of it runs on the stock Fedora kernel. Must stay before the
  # systemd module, which enables zram-recompress.timer.
  # ------------------------------------------------------------------
  - type: files
    files:
      - source: system
        destination: /

  # ------------------------------------------------------------------
  # Services. keyd.service comes from the keyd package; ydotool.service
  # from bluefin-dx. earlyoom is deliberately absent: bluefin already runs
  # systemd-oomd, and two OOM killers race each other.
  # me.proton.vpn.split_tunneling.service replaces the enable that the
  # skipped %posttrans scriptlet would have performed.
  # ------------------------------------------------------------------
  # NB: pvpnd.service is NOT enabled here. This module runs BEFORE the pvpn
  # script module that installs the unit, so `systemctl enable` failed with
  # "Unit pvpnd.service does not exist" and took the whole build with it.
  # It is enabled inside that script instead, right after the file lands.
  - type: systemd
    system:
      enabled:
        - keyd.service
        - ydotool.service
        - me.proton.vpn.split_tunneling.service
        - zram-recompress.timer

  # ------------------------------------------------------------------
  # pvpn - Proton VPN wrapper for filtered networks.
  # https://github.com/luohoa97/protun-unblocked
  #
  # Baked in so it survives reboots and image rebases. Losing it on every
  # reboot is exactly what made this painful before: packages installed
  # into a `rpm-ostree usroverlay` are transient.
  #
  # Pinned to a commit, not a branch, so an image rebuild cannot silently
  # change what ships. Bump PVPN_REF to take new work.
  #
  # The GUI is deliberately NOT built here: it would pull cargo and the
  # gtk4/libadwaita crates into every image build for something most users
  # will not open. `ujust pvpn-gui-install` builds it on demand instead.
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - |
        set -euo pipefail
        PVPN_REF=6159407
        tmp=$(mktemp -d)
        curl -fsSL "https://github.com/luohoa97/protun-unblocked/archive/${PVPN_REF}.tar.gz" \
          | tar -xz -C "$tmp" --strip-components=1

        install -Dm755 "$tmp/bin/vpn-check"        /usr/bin/vpn-check
        install -Dm644 "$tmp/lib/sitecustomize.py" /usr/share/pvpn/sitecustomize.py
        install -Dm755 "$tmp/lib/pvpn-scan.py"     /usr/share/pvpn/pvpn-scan.py
        install -Dm755 "$tmp/lib/signin-bridge.py" /usr/share/pvpn/signin-bridge.py
        install -Dm755 "$tmp/dist/pvpn-resume"     /usr/share/pvpn/pvpn-resume

        # pvpn + pvpnd, from the cargo workspace.
        #
        # The tree moved to crates/ - `daemon/` no longer exists, and this
        # step silently built nothing until it was updated. Both binaries
        # are built in one pass; -p keeps the GUI out, which is excluded
        # from the workspace anyway because gtk4 is a different order of
        # build cost. The toolchain is removed again below.
        dnf install -y cargo
        (cd "$tmp" && cargo build --release -p pvpn -p pvpnd --offline 2>/dev/null \
            || cargo build --release -p pvpn -p pvpnd)
        # The Rust CLI is the front door; the bash implementation is kept
        # as pvpn-legacy for the commands not yet ported, and pvpn delegates
        # to it. It must NOT be installed as `pvpn`, or the Rust binary
        # would find itself and recurse.
        install -Dm755 "$tmp/target/release/pvpn"  /usr/bin/pvpn
        install -Dm755 "$tmp/bin/pvpn"             /usr/libexec/pvpn-legacy
        install -Dm755 "$tmp/target/release/pvpnd" /usr/bin/pvpnd
        install -Dm644 "$tmp/dist/pvpnd.service" \
            /usr/lib/systemd/user/pvpnd.service
        # --global enables a USER unit for every user, which is what this
        # needs: pvpnd must run as you, not root. Done here rather than in
        # the systemd module because that module runs earlier, before this
        # file exists.
        systemctl --global enable pvpnd.service
        # Non-fatal: worst case the image carries cargo, which is bloat but
        # not breakage.
        dnf remove -y cargo rust || true

        # Repair the tunnel after suspend. protun's own reconnect probes
        # with a WireGuard UDP handshake, which a UDP-blocking network never
        # answers - so it retries forever while NetworkManager still shows
        # proton0 activated and the CLI still says Connected. The hook only
        # acts when traffic has actually stopped, so a tunnel that survived
        # resume is left alone.
        install -Dm755 "$tmp/dist/pvpn-resume" \
          /usr/lib/systemd/system-sleep/pvpn-resume

        # 00-entry.just does `import? ".../60-custom.just"`, and that single
        # file is the whole extension point - so APPEND rather than
        # overwrite, or we would silently drop anyone else's recipes.
        install -d /usr/share/ublue-os/just
        JUST=/usr/share/ublue-os/just/60-custom.just
        if [ -f "$JUST" ] && grep -q 'pvpn-login' "$JUST"; then
          echo "pvpn recipes already present in 60-custom.just"
        else
          cat "$tmp/dist/60-pvpn.just" >> "$JUST"
        fi

        rm -rf "$tmp"
        pvpn --help >/dev/null && echo "pvpn installed to /usr/bin"

  # ------------------------------------------------------------------
  # composefs backend support.
  #
  # bootc's composefs backend mounts the root from the initramfs via
  # bootc-root-setup.service, which lives in the 51bootc dracut module.
  # That module never includes itself (its check() returns 255), so the
  # stock bluefin initramfs cannot boot a composefs deployment. Opt in and
  # regenerate. The unit is gated on the `composefs` karg, so the ostree
  # backend keeps booting this image unchanged.
  #
  # Kept last among the modules so that the initramfs is built against
  # the final package set.
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - |
        set -euo pipefail
        printf 'add_dracutmodules+=" bootc "\n' \
          > /usr/lib/dracut/dracut.conf.d/60-bootc-composefs.conf
        kvers=(/usr/lib/modules/*)
        [ "${#kvers[@]}" -eq 1 ] || { echo "expected one kernel, found: ${kvers[*]}" >&2; exit 1; }
        kver=$(basename "${kvers[0]}")
        # dracut refuses to run without /var/tmp, which bootc images ship empty.
        mkdir -p /var/tmp
        dracut --force --no-hostonly --reproducible --kver "$kver" \
          "/usr/lib/modules/$kver/initramfs.img"
        # Not `grep -q`: it exits on the first match, lsinitrd dies of
        # SIGPIPE, and pipefail turns that into a failed build.
        lsinitrd "/usr/lib/modules/$kver/initramfs.img" \
          | grep bootc-root-setup.service >/dev/null

  - type: signing
