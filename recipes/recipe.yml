name: bluefin-developers
description: My personal development Bluefin image.
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  # ------------------------------------------------------------------
  # Third-party repos.
  # Terra was removed: nothing in the package list below comes from it,
  # and it was the flaky step (primary.xml.zck curl timeout + unsigned
  # repo metadata) that broke the 2026-07-27 build.
  # ------------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        - alternateved/keyd
      files:
        - https://aaddrick.github.io/claude-desktop-debian/rpm/claude-desktop.repo

  # ------------------------------------------------------------------
  # Proton VPN: BETA channel.
  #
  # protonvpn-beta-release configures [protonvpn-fedora-unstable], which
  # is the only channel shipping proton-vpn-linux. That package provides
  # /usr/lib/NetworkManager/VPN/nm-protun.name plus the native
  # proton/vpn/linux.abi3.so, i.e. the "protun" backend that the Proton
  # stack exposes as the Stealth protocol. Stable ships neither.
  #
  # The beta-release RPM itself lives under the -stable/ tree.
  # Proton's signing key is imported first so this stays gpgcheck-clean.
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - curl -fsSL "https://repo.protonvpn.com/fedora-$(rpm -E %fedora)-stable/public_key.asc" -o /tmp/protonvpn.asc
      - rpm --import /tmp/protonvpn.asc
      - dnf install -y "https://repo.protonvpn.com/fedora-$(rpm -E %fedora)-stable/protonvpn-beta-release/protonvpn-beta-release-1.0.4-1.noarch.rpm"

  # ------------------------------------------------------------------
  # Packages
  # ------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        # --- Proton VPN dependencies ---
        # Installed here, with scriptlets running normally, so that the
        # noscripts transaction further down contains ONLY Proton
        # packages. Verified as the complete set of non-Proton deps that
        # bluefin-dx does not already carry.
        - python3-dbus-fast
        - python3-tabulate
        - python3-jinja2
        - python3-pynacl
        - python3-sentry-sdk

        # --- Node.js ---
        # Fedora 44 has NO unversioned node/nodejs/npm package; only
        # nodejs20/22/24 + nodejsNN-npm. "node" resolved to nothing.
        - nodejs24
        - nodejs24-npm

        # --- Circumvention / networking ---
        - tor
        - obfs4
        - privoxy
        - tailscale

        # --- Dev tooling ---
        - gh
        - ripgrep
        - meson
        - ninja-build
        - sysprof
        - nix

        # --- GNOME / GTK development headers ---
        - mutter-devel
        - gjs-devel
        - gtk4-devel
        - libadwaita-devel
        - gstreamer1-plugin-gtk4

        # --- Desktop / input / media ---
        - wtype
        - ydotool
        - keyd
        - wl-clipboard
        - playerctl
        - vulkan-loader

        # --- System ---
        - earlyoom
        - sysstat
        - waydroid
        - duo_unix
        - bluez-deprecated # provides /usr/bin/hcitool ("hcitool" is not a package)

        # --- Apps ---
        - claude-desktop

  # ------------------------------------------------------------------
  # Proton VPN stack, installed with scriptlets disabled.
  #
  # proton-vpn-daemon's %posttrans runs:
  #     systemctl daemon-reload
  #     systemctl enable  me.proton.vpn.split_tunneling.service
  #     systemctl start   me.proton.vpn.split_tunneling.service
  #
  # `systemctl start` cannot work during an image build - there is no
  # system D-Bus - so it exits 1 and libdnf5 fails the whole
  # transaction ("Failed to connect to system scope bus ... Host is
  # down"). tsflags=noscripts skips it; the unit is instead enabled
  # declaratively in the systemd module below, and it starts at boot.
  #
  # Scoped to a separate transaction on purpose: every non-Proton
  # dependency is installed above, so nothing else loses its scriptlets.
  # The only other Proton scriptlets are `killall nm-protun-service
  # || true` guards, which are no-ops in a build.
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - dnf install -y --setopt=tsflags=noscripts proton-vpn-cli proton-vpn-linux

  # ------------------------------------------------------------------
  # Services. Verified unit names: keyd.service, ydotool.service,
  # earlyoom.service, tor.service all exist in their packages.
  # tor.service is enabled so the SOCKS proxy on 127.0.0.1:9050 is
  # available after every boot without manual intervention.
  # me.proton.vpn.split_tunneling.service replaces the enable that the
  # skipped %posttrans scriptlet would have performed.
  # ------------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - keyd.service
        - ydotool.service
        - earlyoom.service
        - tor.service
        - me.proton.vpn.split_tunneling.service

  # ------------------------------------------------------------------
  # Playwright browsers, installed image-wide instead of into root's
  # ~/.cache (where the old "npx playwright install" put them, making
  # them invisible to your user account at runtime).
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - mkdir -p /usr/lib/playwright /etc/environment.d
      - printf 'PLAYWRIGHT_BROWSERS_PATH=/usr/lib/playwright\n' > /etc/environment.d/60-playwright.conf
      - printf 'export PLAYWRIGHT_BROWSERS_PATH=/usr/lib/playwright\n' > /etc/profile.d/playwright.sh
      - PLAYWRIGHT_BROWSERS_PATH=/usr/lib/playwright npx --yes playwright install chromium

  # ------------------------------------------------------------------
  # pvpn - Proton VPN wrapper for filtered networks.
  # https://github.com/luohoa97/protun-unblocked
  #
  # Baked in so it survives reboots and image rebases. Losing it on every
  # reboot is exactly what made this painful before: packages installed
  # into a `rpm-ostree usroverlay` are transient.
  #
  # Pinned to a commit, not a branch, so an image rebuild cannot silently
  # change what ships. Bump PVPN_REF to take new work.
  #
  # The GUI is deliberately NOT built here: it would pull cargo and the
  # gtk4/libadwaita crates into every image build for something most users
  # will not open. `ujust pvpn-gui-install` builds it on demand instead.
  # ------------------------------------------------------------------
  - type: script
    snippets:
      - |
        set -euo pipefail
        PVPN_REF=1a6a1aa
        tmp=$(mktemp -d)
        curl -fsSL "https://github.com/luohoa97/protun-unblocked/archive/${PVPN_REF}.tar.gz" \
          | tar -xz -C "$tmp" --strip-components=1

        install -Dm755 "$tmp/bin/pvpn"             /usr/bin/pvpn
        install -Dm755 "$tmp/bin/vpn-check"        /usr/bin/vpn-check
        install -Dm644 "$tmp/lib/sitecustomize.py" /usr/share/pvpn/sitecustomize.py
        install -Dm755 "$tmp/lib/pvpn-scan.py"     /usr/share/pvpn/pvpn-scan.py
        install -Dm755 "$tmp/lib/signin-bridge.py" /usr/share/pvpn/signin-bridge.py
        install -Dm755 "$tmp/dist/pvpn-resume"     /usr/share/pvpn/pvpn-resume

        # Repair the tunnel after suspend. protun's own reconnect probes
        # with a WireGuard UDP handshake, which a UDP-blocking network never
        # answers - so it retries forever while NetworkManager still shows
        # proton0 activated and the CLI still says Connected. The hook only
        # acts when traffic has actually stopped, so a tunnel that survived
        # resume is left alone.
        install -Dm755 "$tmp/dist/pvpn-resume" \
          /usr/lib/systemd/system-sleep/pvpn-resume

        # 00-entry.just does `import? ".../60-custom.just"`, and that single
        # file is the whole extension point - so APPEND rather than
        # overwrite, or we would silently drop anyone else's recipes.
        install -d /usr/share/ublue-os/just
        JUST=/usr/share/ublue-os/just/60-custom.just
        if [ -f "$JUST" ] && grep -q 'pvpn-login' "$JUST"; then
          echo "pvpn recipes already present in 60-custom.just"
        else
          cat "$tmp/dist/60-pvpn.just" >> "$JUST"
        fi

        rm -rf "$tmp"
        pvpn help >/dev/null && echo "pvpn installed to /usr/bin"

  - type: signing
